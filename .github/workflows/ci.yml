name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chemtrack_owner
          POSTGRES_PASSWORD: owner_dev
          POSTGRES_DB: chemtrack
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chemtrack_owner -d chemtrack"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://chemtrack_owner:owner_dev@localhost:5432/chemtrack
      AUTH_SECRET: ci-secret-not-for-production
      AUTH_TRUST_HOST: "true"

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma migrate deploy
      - run: pnpm prisma generate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:seed
      - run: pnpm verify:audit
      - run: pnpm build
